[project]
name = "ytdlpy-backend"
version = "0.1.0"
description = "FastAPI + Socket.IO backend for YTDLP-PY-GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-socketio>=5.11.0",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "yt-dlp>=2024.3.10",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "pycryptodome>=3.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
